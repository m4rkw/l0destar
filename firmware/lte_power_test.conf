# LTE TX power / brown-out test overlay.  Replaces the tracker with a rig
# that idles with LED1 on and, on an ignition OFF->ON edge (or ENTER over the
# serial console, when USB is attached), pushes ~10 s of uplink UDP traffic
# through the modem flat-out — the sustained-TX supply load of a unit
# transmitting at full power in a low-signal area.  LED2 joins LED1 during
# the burst; surviving it lights all three LEDs, held until ignition is
# turned OFF (which also re-arms the trigger).  A brown-out resets the
# board, so LED3 never lights and the unit comes back up at LED1 only.
#
# The ignition trigger is the one to use when measuring current: USB takes
# over the power input, so the PSU-only run this test exists for has no
# serial console.  Flick the ignition wire for each burst (it must drop back
# to OFF before it re-arms); needs CONFIG_APP_DEBUG_IGNITION=-1.  Build with:
#
#   LTE_TEST=1 BUILD_SUBDIR=build_lte_test ./build.sh
#
# then flash build_lte_test/merged.hex.

CONFIG_APP_LTE_POWER_TEST=y
