# --- core ------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# --- logging ---------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
# Console UARTE is suspended across the sleep wait (console_suspend() in
# main.c) — left enabled it holds the HF clock for ~600-900 uA.
CONFIG_PM_DEVICE=y

# --- nRF modem -------------------------------------------------------------
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY=y
CONFIG_NRF_MODEM_LINK_BINARY_CELLULAR=y
CONFIG_LTE_LINK_CONTROL=y
# LTE-M preferred with NB-IoT fallback, so losing LTE-M coverage (e.g. EE)
# doesn't strand the tracker when another operator's NB-IoT is reachable.
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y
CONFIG_LTE_MODE_PREFERENCE_LTE_M=y
# --- networking / sockets via the modem ------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# --- entropy / crypto ------------------------------------------------------
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS=y
CONFIG_PSA_WANT_KEY_TYPE_CHACHA20=y
CONFIG_PSA_WANT_ALG_CHACHA20_POLY1305=y

# --- TLS (nRF Cloud A-GNSS uses HTTPS; modem key mgmt for its cert) -------
CONFIG_MODEM_KEY_MGMT=y

# --- RAI (Release Assistance Indication) -----------------------------------
CONFIG_LTE_LC_RAI_MODULE=y
CONFIG_LTE_RAI_REQ=y

# --- GPIO + watchdog -------------------------------------------------------
CONFIG_GPIO=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_WATCHDOG=y

# --- over-the-air updates (src/fota.c) -------------------------------------
# The libraries themselves are pulled in by CONFIG_APP_FOTA; MCUboot support
# in the app image comes from sysbuild.conf, and this makes the dependency
# explicit (boot_write_img_confirmed() etc.).
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_DOWNLOADER_STACK_SIZE=4096

# --- printf with floats ----------------------------------------------------
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_REQUIRES_FULL_LIBC=y

# --- date-time (NTP fallback when NITZ is unavailable) --------------------
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=y

# --- nRF Cloud A-GNSS via REST --------------------------------------------
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_REST=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_JWT=y

# --- application -----------------------------------------------------------
CONFIG_APP_APN="iot.1nce.net"
CONFIG_APP_LOG_LEVEL=3

# --- Kconfig warning policy ------------------------------------------------
CONFIG_WARN_DEPRECATED=n
CONFIG_WARN_EXPERIMENTAL=n
