# --- core ------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# --- logging ---------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# A send logs every record in the batch back to back (~300 bytes each) and
# the log thread only wakes on a 1 s timer or ten queued messages, so the
# default 1 KB buffer overflowed on every send and the core discarded the
# oldest lines.  Room for a whole burst, and wake the thread on a few
# messages rather than ten.
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=3
CONFIG_USE_SEGGER_RTT=n
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
# Console UARTE is suspended across the sleep wait (console_suspend() in
# main.c) — left enabled it holds the HF clock for ~600-900 uA.
CONFIG_PM_DEVICE=y

# --- nRF modem -------------------------------------------------------------
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY=y
CONFIG_NRF_MODEM_LINK_BINARY_CELLULAR=y
CONFIG_LTE_LINK_CONTROL=y
# LTE-M only, plus GNSS.  NB-IoT is off, so the modem never falls back to it
# when LTE-M coverage drops: registration is simpler and quicker, at the cost
# of having no second RAT to reach for where LTE-M is unavailable.
#
# Deliberately no CONFIG_LTE_MODE_PREFERENCE_* line.  Every preference symbol
# depends on one of the two dual-mode choices, so pairing one with a
# single-RAT mode is an unmet dependency and Kconfig drops it with a warning.
# lte_link_control then uses preference 0 (auto), which is what %XSYSTEMMODE
# takes when only one RAT is enabled.
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y
# --- networking / sockets via the modem ------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# --- entropy / crypto ------------------------------------------------------
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS=y
CONFIG_PSA_WANT_KEY_TYPE_CHACHA20=y
CONFIG_PSA_WANT_ALG_CHACHA20_POLY1305=y

# --- TLS (nRF Cloud A-GNSS uses HTTPS; modem key mgmt for its cert) -------
CONFIG_MODEM_KEY_MGMT=y

# --- RAI (Release Assistance Indication) -----------------------------------
CONFIG_LTE_LC_RAI_MODULE=y
CONFIG_LTE_RAI_REQ=y

# --- GPIO + watchdog -------------------------------------------------------
CONFIG_GPIO=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_WATCHDOG=y

# --- over-the-air updates (src/fota.c) -------------------------------------
# The libraries themselves are pulled in by CONFIG_APP_FOTA; MCUboot support
# in the app image comes from sysbuild.conf, and this makes the dependency
# explicit (boot_write_img_confirmed() etc.).
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_DOWNLOADER_STACK_SIZE=4096

# --- printf with floats ----------------------------------------------------
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_REQUIRES_FULL_LIBC=y

# --- date-time (NTP fallback when NITZ is unavailable) --------------------
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=y

# --- nRF Cloud A-GNSS via REST --------------------------------------------
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_REST=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_JWT=y

# --- application -----------------------------------------------------------
CONFIG_APP_APN="iot.1nce.net"
CONFIG_APP_LOG_LEVEL=3

# --- Kconfig warning policy ------------------------------------------------
CONFIG_WARN_DEPRECATED=n
CONFIG_WARN_EXPERIMENTAL=n
