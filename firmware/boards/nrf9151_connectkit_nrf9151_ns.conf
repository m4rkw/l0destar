# Makerdiary nRF9151 Connect Kit: applied by Zephyr to every build for the
# nrf9151_connectkit/nrf9151/ns target, bench and PCB alike.
#
# GNSS antenna front-end.  The Connect Kit's GNSS U.FL feeds an onboard LNA
# whose supply (a TPS7A02 LDO) is enabled by the nRF9151's COEX0 pin.  COEX0 is
# only asserted in the GPS L1 band once the modem_antenna library has sent
# AT%XCOEX0 at boot, and the board target does not turn the library on (only
# Nordic's own boards do), so without these lines GNSS sees no satellites.
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_GNSS_ONBOARD=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT%XCOEX0=1,1,1565,1586"
