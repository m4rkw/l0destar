# Provisioning-build overlay.  Turns the tracker app into an AT-host bridge so
# nrfcloud-utils can onboard the device to nRF Cloud over serial — no separate
# at_client sample needed.  Build with:
#
#   PROV=1 BUILD_DIR="$PWD/build_prov" ./build.sh pristine
#
# Flow:  flash build_prov/merged.hex
#   -> device_credentials_installer --cmd-type at --ca onboarding/*_ca.pem \
#          --ca-key onboarding/*_prv.pem --id-imei --id-str nrf- -d \
#          --csv onboarding/onboard.csv
#   -> nrf_cloud_onboard --api-key <KEY> --csv onboarding/onboard.csv
#   -> reflash the normal build (./build.sh)
# Credentials are written to modem NVM, so they survive reflashing.

CONFIG_APP_PROVISION_MODE=y

# AT Host library: pipes nrfcloud-utils (--cmd-type at) <-> modem (AT%KEYGEN…)
CONFIG_AT_HOST_LIBRARY=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Keep the console UART clean for the AT exchange (no interleaved log lines).
CONFIG_LOG=n
