# Sysbuild image configuration.
#
# MCUboot is what makes over-the-air updates possible: src/fota.c streams the
# downloaded image into the secondary slot, MCUboot swaps it in on the next
# boot.  Default mode on the nRF91 is swap-using-move with ECDSA-P256
# signatures — no scratch partition, and the swap is revertible: the image is
# marked BOOT_UPGRADE_TEST, so if the new firmware never reaches
# boot_write_img_confirmed() (main.c, after init completes) MCUboot rolls back
# to the previous one on the following boot.
#
# Adding this splits the 1 MB flash into two ~448 KB slots (TF-M + app is
# ~260 KB today), so the first build after this change must be flashed over
# SWD — a unit running a pre-MCUboot image cannot update itself into one.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Signing key: mcuboot_priv.pem in the repo root (gitignored).  Generated
# 2026-08-19 with the imgtool bundled in NCS (there is no standalone imgtool
# binary on macOS):
#
#   python3 /opt/nordic/ncs/v3.3.0/bootloader/mcuboot/scripts/imgtool.py \
#       keygen -t ecdsa-p256 -k mcuboot_priv.pem
#
# KEEP A BACKUP of the private key: the public half is baked into every
# deployed bootloader, so losing it means no device already in the field can
# ever be updated again.  The path must be absolute and space-free (Kconfig
# mangles spaces), hence the ~/code firmlink alias of the iCloud repo path.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/Users/mark/code/l0destar/firmware/mcuboot_priv.pem"
