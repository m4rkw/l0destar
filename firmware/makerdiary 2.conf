# Makerdiary nRF9151 Connect Kit — settings that apply to all Connect Kit
# builds (bench and PCB).  Bench-specific pin wiring is in Kconfig.boards
# (BOARD_NRF9151_CONNECTKIT defaults); per-PCB pin maps come from the
# APP_BOARD_* choice.
#
# Layered on top of prj.conf by build.sh when PROFILE=makerdiary.

# Onomondo SIM
CONFIG_APP_APN="sensor.net"

# GNSS antenna front-end.
# The Connect Kit's U.FL GNSS antenna feeds an onboard LNA whose supply (a
# TPS7A02 LDO) is enabled by the nRF9151's COEX0 pin.  COEX0 is only asserted
# in the GPS L1 band if the modem_antenna library sends AT%XCOEX0 at boot.
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_GNSS_ONBOARD=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT%XCOEX0=1,1,1565,1586"

CONFIG_APP_DEBUG_IGNITION=0
